<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./src/css/reset.css" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <link rel="stylesheet" href="./src/css/toolbar.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
    <title>Tg Chat</title>
  </head>
  <body>
    <div class="app">
      <div class="app__container">
        <div class="chat">
          <!-- chat header -->
          <div class="chat__header">
            <div class="chat__header-info">
              <div class="chat__header-ava">pic</div>
              <div class="chat__header-text">
                <div class="chat__header-title">title</div>
                <div class="chat__header-subs">1 500 subscribers</div>
              </div>
            </div>
          </div>

          <!-- chat messages -->
          <div class="chat__messages">
            <div class="message message--received">
              <div class="message__content">
                <div class="message__content-text" tabindex="0"></div>
                <!-- <div class="message__content-media"></div> -->
              </div>
              <div class="message__meta">
                <div class="message__meta-time"></div>
              </div>
            </div>
          </div>

          <!-- input -->
          <div class="chat__input">
            <div class="chat__emoji-picker">:)</div>
            <div
              class="chat__input-field"
              contenteditable="true"
              data-placeholder="Message..."
            ></div>
            <div class="chat__file-pin">$</div>
          </div>
        </div>
      </div>
      <script type="module" src="./src/js/app.js"></script>
    </div>

    <div class="text-toolbar" id="textToolbar">
      <button class="toolbar-btn" tool-cmd="bold"><strong>B</strong></button>
      <button class="toolbar-btn" tool-cmd="italic"><em>I</em></button>
      <button class="toolbar-btn" tool-cmd="underline"><u>U</u></button>
      <button class="toolbar-btn" tool-cmd="strikethrough"><s>S</s></button>
      <button class="toolbar-btn" tool-cmd="insertLink">🔗</button>
    </div>

    <div class="emoji-picker-container" id="emojiPickerContainer" hidden>
      <div class="emoji-picker-header">
      </div>
      <div class="emoji-picker-grid">
      </div>
      <div class="emoji-picker-footer">
      </div>
    </div>
  </body>
</html>
